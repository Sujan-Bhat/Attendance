org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

android.useAndroidX=true
android.enableJetifier=true

kotlin.code.style=official
# Disable incremental Kotlin compilation to fix Windows cross-drive path bug
# (pub cache on C: vs project on E: causes IllegalArgumentException)
kotlin.incremental=false
kotlin.daemon.jvmargs=-Xmx2048M
android.ndkVersion=
android.buildFeatures.ndk=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
